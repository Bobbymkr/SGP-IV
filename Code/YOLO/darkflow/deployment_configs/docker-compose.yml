networks:
  traffic-network:
    driver: bridge
services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: predictive-analytics
    depends_on:
    - postgres
    environment:
    - ENV=production
    - ML_MODEL_PATH=/app/models
    - DATABASE_URL=postgresql://postgres:password@postgres:5432/traffic_db
    ports:
    - 8003:8003
    restart: unless-stopped
    volumes:
    - ./models:/app/models
    - ./data:/app/data
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: analytics-dashboard
    depends_on:
    - traffic-controller
    environment:
    - ENV=production
    - API_BASE_URL=http://traffic-controller:8000
    ports:
    - 8501:8501
    restart: unless-stopped
  environmental-service:
    build:
      context: .
      dockerfile: Dockerfile.environmental
    container_name: environmental-integration
    environment:
    - ENV=production
    - WEATHER_API_KEY=${WEATHER_API_KEY}
    - AIR_QUALITY_API_KEY=${AIR_QUALITY_API_KEY}
    ports:
    - 8004:8004
    restart: unless-stopped
  grafana:
    container_name: traffic-grafana
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    image: grafana/grafana:latest
    ports:
    - 3000:3000
    restart: unless-stopped
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
  kafka:
    container_name: traffic-kafka
    depends_on:
    - zookeeper
    environment:
    - KAFKA_BROKER_ID=1
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    image: confluentinc/cp-kafka:7.4.0
    ports:
    - 9092:9092
    restart: unless-stopped
  nginx:
    container_name: traffic-nginx
    depends_on:
    - traffic-controller
    - vehicle-detection
    - streaming-service
    - analytics-service
    image: nginx:alpine
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    - ./nginx/ssl:/etc/nginx/ssl
  postgres:
    container_name: traffic-postgres
    environment:
    - POSTGRES_DB=traffic_db
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=password
    image: postgres:15
    ports:
    - 5432:5432
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
  prometheus:
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    container_name: traffic-prometheus
    image: prom/prometheus:latest
    ports:
    - 9090:9090
    restart: unless-stopped
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus_data:/prometheus
  redis:
    command: redis-server /usr/local/etc/redis/redis.conf
    container_name: traffic-redis
    image: redis:7-alpine
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - redis_data:/data
    - ./config/redis.conf:/usr/local/etc/redis/redis.conf
  streaming-service:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    container_name: real-time-streaming
    depends_on:
    - kafka
    - redis
    environment:
    - ENV=production
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - WEBSOCKET_PORT=8002
    ports:
    - 8002:8002
    restart: unless-stopped
  traffic-controller:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: adaptive-traffic-controller
    depends_on:
    - redis
    - postgres
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    environment:
    - ENV=production
    - LOG_LEVEL=INFO
    - REDIS_URL=redis://redis:6379
    - DATABASE_URL=postgresql://postgres:password@postgres:5432/traffic_db
    ports:
    - 8000:8000
    restart: unless-stopped
    volumes:
    - ./config:/app/config
    - ./logs:/app/logs
    - ./models:/app/models
  vehicle-detection:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    container_name: yolo-vehicle-detection
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    environment:
    - ENV=production
    - YOLO_MODEL_PATH=/app/models/yolov8n.pt
    - GPU_ENABLED=true
    ports:
    - 8001:8001
    runtime: nvidia
    volumes:
    - ./models:/app/models
    - ./camera_feeds:/app/camera_feeds
  zookeeper:
    container_name: traffic-zookeeper
    environment:
    - ZOOKEEPER_CLIENT_PORT=2181
    - ZOOKEEPER_TICK_TIME=2000
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
version: '3.8'
volumes:
  grafana_data: {}
  postgres_data: {}
  prometheus_data: {}
  redis_data: {}
