[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traffic-signal"
version = "1.0.0"
description = "AI-powered adaptive traffic signal control system with real-time vehicle detection and dynamic signal timing optimization"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Adaptive Traffic Signal Team", email = "team@adaptivesignal.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    # Core web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # UI / Dashboard -> pip install -e ".[ui]"
    # Computer Vision / ML -> pip install -e ".[cv]"

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",

    # Database / Cache
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",

    # Async / Networking
    "httpx>=0.25.0",
    "websockets>=12.0",
    "aiofiles>=23.2.0",

    # Monitoring / Logging
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",

    # CLI / Utilities
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
]
prod = [
    "gunicorn>=21.2.0",
    "gevent>=23.9.0",
    "sentry-sdk[fastapi]>=1.38.0",
    "grafana-api>=1.0.3",
    "datadog>=0.47.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "py-cpuinfo>=9.0.0",
]
cv = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.2.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
ui = [
    "streamlit>=1.28.0",
    "altair>=5.0.0",
]
ml = [
    "tensorflow>=2.15.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.27.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/your-org/adaptive-traffic-signal"
Repository = "https://github.com/your-org/adaptive-traffic-signal"
Issues = "https://github.com/your-org/adaptive-traffic-signal/issues"
Documentation = "https://adaptive-traffic-signal.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adaptive_traffic*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "security: Security tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/conftest.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
