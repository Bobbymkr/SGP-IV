name: Continuous Integration

# Mirrors AGENTS.md: the ONLY verification entry points are the make targets
# (Windows: the underlying commands). Keep this file in sync with them.
#
# Lint scope is the graded/active paths (core pipeline, config, unit +
# loop/integration tests, gated scripts) — NOT the legacy UI and one-off
# scripts, which carry documented style debt. flake8 gates errors+pyflakes
# only (undefined names, unused imports/vars); E501/E722/W style debt is
# tracked, not CI-blocking. mypy is local-only (pre-commit, 138 baseline
# errors at last count).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  LINT_PATHS: >-
    src/adaptive_traffic/core/control/
    src/adaptive_traffic/core/detection/adapters_onnx.py
    src/adaptive_traffic/core/detection/base.py
    src/adaptive_traffic/core/simulation/
    src/adaptive_traffic/core/analytics/queue_estimator.py
    src/adaptive_traffic/core/pipeline.py
    src/adaptive_traffic/core/closed_loop.py
    src/adaptive_traffic/core/ports/
    src/adaptive_traffic/config/
    tests/unit/
    tests/integration/test_closed_loop.py
    tests/integration/test_stmp_wire.py
    tests/integration/test_ntcip.py
    scripts/prepare_dataset.py
    scripts/footage.py
    scripts/score_queue.py
    scripts/run_closed_loop.py
    scripts/bench_detect.py

jobs:
  lint:
    name: Lint (black/isort/flake8-F)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with LFS registry models)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cv]"

      - name: Run Black
        run: black --check --line-length=100 ${{ env.LINT_PATHS }}

      - name: Run isort
        run: isort --check-only --profile=black --line-length=100 ${{ env.LINT_PATHS }}

      - name: Run flake8 (errors + pyflakes)
        run: flake8 --select=E9,F --max-line-length=100 --extend-ignore=E203,W503 src/ tests/ scripts/prepare_dataset.py scripts/footage.py scripts/score_queue.py scripts/run_closed_loop.py scripts/bench_detect.py scripts/bench_decide.py

  test:
    name: Tests (loop-fast scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with LFS registry models)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cv]"

      - name: Run unit + integration tests
        run: python -m pytest tests/unit tests/integration -q --no-header -p no:cacheprovider

  eval:
    name: Eval matrix (adaptive vs fixed)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code (with LFS registry models)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cv]"

      # Deterministic (seed 42): 11/11 adaptive wins, dec_p95 regression flag
      # (>10ms fails), >5% wait regression flag vs previous scorecard.
      - name: Run eval matrix
        run: python evals/runner.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: configs/docker/Dockerfile
          push: false
          tags: adaptive-traffic-signal:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
