version: '3.8'

services:
  # Main API Server
  traffic-api:
    build:
      context: ../..
      dockerfile: configs/docker/Dockerfile
    image: adaptive-traffic-signal:latest
    container_name: traffic-api
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://trafficuser:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/trafficdb
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - YOLO_MODEL_PATH=/app/models/yolov8n.pt
    ports:
      - "8000:8000"
    volumes:
      - ../../logs:/app/logs
      - ../../data:/app/data
      - ../../models:/app/models
      - ../../configs:/app/configs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - traffic-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Streamlit Dashboard
  traffic-dashboard:
    build:
      context: ../..
      dockerfile: configs/docker/Dockerfile
    image: adaptive-traffic-signal:latest
    container_name: traffic-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "src/adaptive_traffic/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://trafficuser:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/trafficdb
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8501:8501"
    volumes:
      - ../../logs:/app/logs
      - ../../data:/app/data
    depends_on:
      - traffic-api
    networks:
      - traffic-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: traffic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: traffic-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trafficdb
      - POSTGRES_USER=trafficuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "trafficuser", "-d", "trafficdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: traffic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../../logs/nginx:/var/log/nginx
    depends_on:
      - traffic-api
      - traffic-dashboard
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: traffic-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/web/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/web/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - traffic-network

  # Grafana Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: traffic-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - traffic-network

  # Loki Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: traffic-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ../../logs:/loki/logs
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - traffic-network

volumes:
  postgres_data:
    driver: local
  postgres_logs:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  traffic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
