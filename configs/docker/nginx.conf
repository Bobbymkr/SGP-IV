# Nginx Configuration for Production
# =====================================

# Upstream backend servers
upstream traffic_backend {
    least_conn;
    server traffic-signal-app:8000;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Rate limiting
limit_req_zone $binary_remote_addr {
    zone $limit_req_zone;
    key $binary_remote_addr;
    rate 10r/s;
    rate 100r/s;
}

# Security headers
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'";

# Main server block
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;

    server_name traffic-signal.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security
    server_tokens off;
    more_clear_headers Server "X-Powered-By";
    more_clear_headers X-Powered-By;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=32k flush=5m;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Client upload limits
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Main location
    location / {
        # Rate limiting
        limit_req zone $binary_remote_addr;

        # Proxy to backend
        proxy_pass http://traffic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8 4k;

        # Error handling
        proxy_next_error http://traffic_backend/error;
        proxy_next_error http://traffic_backend/502;
        proxy_next_error http://traffic_backend/503;
        proxy_next_error http://traffic_backend/504;
    }

    # API endpoints
    location /api/ {
        # Rate limiting for API
        limit_req zone $binary_remote_addr;

        proxy_pass http://traffic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://traffic_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static files
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Gzip static files
        gzip_static on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Block common attacks
    location ~* \.(php|jsp|asp|aspx|cgi|pl|py|rb|sh)$ {
        deny all;
    }

    # DDoS protection
    location / {
        limit_conn zone $binary_remote_addr addr=10m;
        limit_req zone $binary_remote_addr n=5r/s;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    error_page 502 /502.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }
}

# HTTPS redirect
server {
    listen 443 ssl;
    server_name traffic-signal.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Monitoring endpoint
server {
    listen 9090;
    server_name localhost;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}
